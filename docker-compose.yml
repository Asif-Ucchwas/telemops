services:
  can-publisher:
    build: ./ingestion
    network_mode: host
    restart: unless-stopped

  ingestor:
    build: ./ingestion
    command: python ingest.py
    network_mode: host
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    build: ./postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  grafana:
    build: ./grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: telemops_admin
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  pgdata:
  grafana-data:
