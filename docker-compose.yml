services:
  can-publisher:
    build: ./ingestion
    network_mode: host
    restart: unless-stopped

  ingestor:
    build: ./ingestion
    command: python ingest.py
    network_mode: host
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    build: ./postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
